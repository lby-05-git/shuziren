<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数字人直播间</title>
  <style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070d;font-family:"Microsoft YaHei",sans-serif}.wrap{width:100%;height:100%;position:relative;display:grid;place-items:center}.wrap video{width:100%;height:100%;object-fit:contain}.status{position:absolute;left:18px;top:18px;background:#111827dd;color:white;border:1px solid #334155;border-radius:999px;padding:8px 13px;font-size:12px}.live{color:#ff6680}.empty{color:#94a3b8;text-align:center}.empty b{display:block;color:white;font-size:18px;margin-bottom:8px}.danmaku{position:absolute;left:16px;top:62px;display:flex;flex-direction:column;gap:6px;max-width:58%}.danmaku span{align-self:flex-start;padding:5px 11px;border-radius:999px;background:#090e20b8;color:white;font-size:12px}.danmaku span.host{background:#415fffdc}.ask{position:absolute;left:16px;right:16px;bottom:15px;display:flex;gap:8px}.ask input{flex:1;height:38px;padding:0 15px;border:1px solid #ffffff35;border-radius:999px;background:#090e20c7;color:white;outline:0}.ask button{padding:0 20px;border:0;border-radius:999px;background:#415fff;color:white;font-weight:700}</style>
</head>
<body><main class="wrap"><video id="video" playsinline loop></video><div id="empty" class="empty"><b>AI 数字人直播间</b>等待直播开始</div><div id="status" class="status">连接中</div><div id="danmaku" class="danmaku"></div><form id="ask" class="ask"><input id="question" maxlength="120" placeholder="发弹幕向数字人提问…"><button>发送</button></form></main>
<script>
let id=new URLSearchParams(location.search).get('session'),v=document.querySelector('#video'),s=document.querySelector('#status'),e=document.querySelector('#empty'),box=document.querySelector('#danmaku'),mainUrl='',state=null;const shown=new Set(),played=new Set();
function add(text,host){const x=document.createElement('span');x.textContent=text;if(host)x.className='host';box.appendChild(x);while(box.children.length>6)box.removeChild(box.firstChild)}
function restore(){if(!mainUrl)return;v.loop=true;v.dataset.mode='main';v.src=mainUrl;if(state?.playback==='playing')v.play().catch(()=>{})}
v.onended=()=>{if(v.dataset.mode==='reply')restore()};
async function render(x){state=x;if(x.render_status==='ready'){mainUrl=x.video_url+'?v='+encodeURIComponent(x.updated_at||'');if(!v.src){restore();e.style.display='none'}}(x.interactions||[]).forEach(async item=>{if(!shown.has(item.id+'q')){shown.add(item.id+'q');add(`${item.user}：${item.question}`)}if(item.answer&&!shown.has(item.id+'a')){shown.add(item.id+'a');add(`数字人：${item.answer}`,true)}if(item.status==='ready'&&!played.has(item.id)){played.add(item.id);v.pause();v.loop=false;v.dataset.mode='reply';v.src=item.video_url;await v.play().catch(()=>{})}});if(x.playback==='playing'){s.innerHTML='<span class="live">● LIVE</span>';if(v.dataset.mode!=='reply')v.play().catch(()=>{})}else if(x.playback==='paused'){v.pause();s.textContent='直播已暂停'}else if(x.render_status!=='ready'){s.textContent=`画面生成中 ${x.progress||0}%`}else{s.textContent='直播未开始'}}
async function poll(){if(!id)return;try{const r=await fetch('/api/v0/live/'+id);if(r.ok)render(await r.json());else s.textContent='直播不存在'}catch(_){s.textContent='连接异常'}}
async function init(){if(!id){const r=await fetch('/api/v0/live/current');if(!r.ok){s.textContent='暂无直播';return}const x=await r.json();id=x.id;render(x)}poll();setInterval(poll,1200)}
document.querySelector('#ask').onsubmit=async ev=>{ev.preventDefault();const input=document.querySelector('#question'),text=input.value.trim();if(!text||!id)return;input.value='';const r=await fetch(`/api/v0/live/${id}/danmaku`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,user:'我'})});if(!r.ok)add('发送失败，请稍后重试')};
document.body.onclick=()=>{if(mainUrl)v.play().catch(()=>{})};init();
</script></body></html>
